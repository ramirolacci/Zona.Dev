<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Robot Body Gradient -->
    <radialGradient id="bodyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </radialGradient>

    <!-- Glowing Aura -->
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Hover / Thruster Aura Glow -->
  <circle cx="50" cy="54" r="38" fill="url(#auraGrad)" />

  <!-- Antenna Rod -->
  <line x1="50" y1="26" x2="50" y2="13" stroke="#64748B" stroke-width="4" stroke-linecap="round" />

  <!-- Antenna Glowing Orb Tip -->
  <circle cx="50" cy="11" r="6" fill="#F59E0B" />
  <circle cx="48" cy="9" r="2" fill="#FEF08A" />

  <!-- Left Ear Cap -->
  <circle cx="21" cy="54" r="7" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />

  <!-- Right Ear Cap -->
  <circle cx="79" cy="54" r="7" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />

  <!-- Main Metallic Body/Head -->
  <circle cx="50" cy="54" r="28" fill="url(#bodyGrad)" stroke="#93C5FD" stroke-width="3" />

  <!-- Dark Glass Visor Screen -->
  <rect x="30" y="44" width="40" height="20" rx="9" fill="#0F172A" stroke="#1E293B" stroke-width="2" />

  <!-- Left Digital LED Eye -->
  <circle cx="40" cy="54" r="4.5" fill="#38BDF8" />
  <circle cx="38.5" cy="52.5" r="1.8" fill="#FFFFFF" />

  <!-- Right Digital LED Eye -->
  <circle cx="60" cy="54" r="4.5" fill="#38BDF8" />
  <circle cx="58.5" cy="52.5" r="1.8" fill="#FFFFFF" />

  <!-- Chest Power LED -->
  <circle cx="50" cy="74" r="2.5" fill="#10B981" />
</svg>